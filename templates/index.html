<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avalon 2026 - Welcome</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            /* Applying the charcoal background from your palette (#2C3531) */
            background-color: #2C3531; 
            /* Off-white text (#D1E8E2) for contrast */
            color: #D1E8E2; 
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .brand-logo {
            max-width: 250px;
            margin-bottom: 2rem;
            /* Optional: adds a slight glow to match the futuristic vibe */

        .btn-custom {

            padding: 12px 35px;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .btn-custom:hover {
            /* Pale peach hover effect (#FFCB9A) */
            background-color: #FFCB9A; 
            color: #2C3531;
        }
    </style>
</head>
<body>
    <div class="text-center container">
        <!-- Jinja2 syntax used here to correctly route the image from the Flask static folder -->

        <h1 class="mb-4">Welcome to the Future</h1>
        <p class="mb-5">Experience the next generation of connectivity.</p>
        
        <!-- Button converted to an anchor tag pointing to the Flask /login route -->
        <a href="/login" class="btn btn-custom btn-lg text-decoration-none">DISCOVER (LOGIN)</a>
