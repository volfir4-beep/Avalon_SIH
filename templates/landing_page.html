<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Avalon 2026 - Welcome</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        /* =========================================
           FULL PAGE
        ========================================= */

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background-image: url("{{ url_for('static', filename='images/background.png') }}");

            background-position: center center;
            background-repeat: no-repeat;

            /*
                Keeps the complete background visible.
            */
            background-size: 100% 100%;

            background-color: #2C3531;

            color: #D1E8E2;

            overflow: hidden;
        }


        /* =========================================
           MAIN CONTENT
        ========================================= */

        .welcome-content {
            position: absolute;

            /*
                Put the content on the right side
                instead of covering the sphere.
            */
            right: 7%;
            top: 50%;

            transform: translateY(-50%);

            width: 38%;
            max-width: 550px;

            text-align: center;

            z-index: 10;

            /*
                Slight background separation so the
                text remains readable.
            */
            padding: 35px 40px;

            background: rgba(5, 25, 27, 0.28);

            border: 1px solid rgba(209, 232, 226, 0.12);

            border-radius: 18px;

            backdrop-filter: blur(3px);

            box-shadow:
                0 0 40px rgba(0, 0, 0, 0.18),
                inset 0 0 30px rgba(17, 100, 102, 0.05);
        }


        /* =========================================
           HEADING
        ========================================= */

        .welcome-content h1 {
            font-size: clamp(2rem, 3vw, 3.2rem);

            font-weight: 700;

            color: #D1E8E2;

            margin-bottom: 20px;

            letter-spacing: 0.5px;

            text-shadow:
                0 2px 12px rgba(0, 0, 0, 0.7);
        }


        /* =========================================
           SUBTITLE
        ========================================= */

        .welcome-content p {
            font-size: clamp(0.95rem, 1.2vw, 1.2rem);

            color: #D1E8E2;

            margin-bottom: 32px;

            line-height: 1.6;

            text-shadow:
                0 2px 8px rgba(0, 0, 0, 0.8);
        }


        /* =========================================
           LOGIN BUTTON
        ========================================= */

        .btn-custom {
            display: inline-block;

            background-color: #116466;

            color: #D1E8E2;

            border: 1px solid rgba(209, 232, 226, 0.2);

            padding: 13px 38px;

            font-size: 1rem;

            font-weight: bold;

            letter-spacing: 1.5px;

            border-radius: 8px;

            transition: all 0.3s ease;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.3);
        }


        .btn-custom:hover {
            background-color: #FFCB9A;

            color: #2C3531;

            transform: translateY(-2px);

            box-shadow:
                0 8px 25px rgba(255, 203, 154, 0.25);
        }


        /* =========================================
           SMALL DECORATIVE LINE
        ========================================= */

        .divider {
            width: 100px;

            height: 2px;

            margin: 0 auto 22px auto;

            background: #116466;

            box-shadow:
                0 0 10px rgba(17, 100, 102, 0.8);
        }


        /* =========================================
           RESPONSIVE DESIGN
        ========================================= */

        @media (max-width: 900px) {

            .welcome-content {
                right: 5%;
                width: 45%;
                padding: 25px;
            }

        }


        @media (max-width: 700px) {

            .welcome-content {
                position: absolute;

                right: 5%;
                left: 5%;

                width: auto;

                top: 60%;

                transform: translateY(-50%);

                padding: 25px 20px;
            }

            .welcome-content h1 {
                font-size: 2rem;
            }

            .welcome-content p {
                font-size: 0.95rem;
            }

        }

    </style>
</head>


<body>

    <!-- =========================================
         WELCOME CONTENT
    ========================================= -->

    <div class="welcome-content">

        <h1>
            Welcome to  the AWS Anomoly Detection
        </h1>

        <div class="divider"></div>

        <p>
            Built by IITians. Fueled by Madness.
        </p>

        <a href="/dashboard"
           class="btn btn-custom text-decoration-none">
            DISCOVER
        </a>

    </div>

</body>
</html>
